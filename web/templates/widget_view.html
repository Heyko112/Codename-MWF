{{define "title"}}{{.Widget.Name}} · Widgets · MWF{{end}}
{{define "content"}}
<div class="toolbar">
  <p class="widget-head"><a href="/widgets">← Widgets</a> <strong>{{.Widget.Name}}</strong> <span class="muted">{{.Widget.Version}}</span>
    {{if not .Widget.Active}}<span class="badge badge-warn">inaktiv, nur für Verwalter sichtbar</span>{{end}}</p>
  {{if index .Can "widgets.manage"}}<a href="/admin/widgets/{{.Widget.ID}}">Verwalten</a>{{end}}
</div>
<script src="/static/widget-host.js"></script>
<iframe class="widget-frame" data-api="{{.API}}" src="{{.Src}}" sandbox="{{.Sandbox}}" referrerpolicy="no-referrer" title="{{.Widget.Name}}"></iframe>
{{end}}
