{{define "layout"}}<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}MWF{{end}}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">MWF</a>
    {{with .}}{{with .User}}
    <nav class="main">
      {{if index $.Can "users.manage"}}<a href="/admin/benutzer">Benutzer</a>{{end}}
      {{if index $.Can "roles.manage"}}<a href="/admin/rollen">Rollen</a>{{end}}
    </nav>
    <form class="logout" method="post" action="/logout">
      <span>{{.Username}}</span>
      <button type="submit" class="link">Abmelden</button>
    </form>
    {{end}}{{end}}
  </header>
  <main class="content">
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
